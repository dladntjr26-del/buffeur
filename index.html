<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 SNS 초안</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1c; --muted:#6b6b6b; --line:#e3e3df; --accent:#2f5d50; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161716; --card:#202221; --text:#eee; --muted:#9a9a96; --line:#33363a; --accent:#7fc4ae; --err:#f2b8b5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:28px 12px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #preview { display:none; max-width:100%; max-height:360px; border-radius:8px; margin:12px auto 0; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  select, input[type=text] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .row > div { flex:1 1 200px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 16px; cursor:pointer; background:var(--accent); color:#fff; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #err { color:var(--err); margin:8px 0 0; min-height:1.2em; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .head h2 { font-size:1rem; margin:0; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; }
  .count { color:var(--muted); font-size:.85rem; margin-top:6px; }
  details summary { cursor:pointer; color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>사진으로 SNS 초안 만들기</h1>
  <p class="sub">사진을 올리면 특성을 분석해 인스타그램·스레드 초안을 써 드려요.</p>

  <div class="card">
    <div id="drop" tabindex="0">사진을 끌어다 놓거나 눌러서 선택 (JPEG·PNG·WEBP·GIF)</div>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
    <img id="preview" alt="선택한 사진 미리보기">
    <div class="row">
      <div>
        <label for="tone">톤</label>
        <select id="tone"><option>친근</option><option>감성</option><option>유머</option><option>정보</option></select>
      </div>
      <div>
        <label for="memo">한마디 메모 (선택)</label>
        <input id="memo" type="text" maxlength="200" placeholder="예: 주말 산책">
      </div>
    </div>
    <div class="row"><button id="go" disabled>초안 만들기</button></div>
    <p id="err" role="alert"></p>
  </div>

  <section id="result" class="hidden">
    <div class="card">
      <details><summary>사진 특성 보기</summary><pre id="features"></pre></details>
    </div>
    <div class="card">
      <div class="head"><h2>인스타그램</h2><button class="ghost" data-copy="ig">복사</button></div>
      <pre id="ig"></pre>
    </div>
    <div class="card">
      <div class="head"><h2>스레드</h2><button class="ghost" data-copy="th">복사</button></div>
      <pre id="th"></pre>
      <div class="count" id="thCount"></div>
    </div>
    <button id="again" class="ghost">다시 생성</button>
  </section>
</main>

<script>
const ENDPOINT = "https://krelzutkcwuzoxbwbhni.supabase.co/functions/v1/photo-to-post";
const MAX_BYTES = 10 * 1024 * 1024;
const MAX_SIDE = 1600;
const TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif"];
const $ = (id) => document.getElementById(id);
let imageData = "";

function showErr(m) { $("err").textContent = m || ""; }

// 긴 변 1600px 이하로 줄여 JPEG/PNG data URL로 만든다 (GIF는 원본 유지)
function toDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다."));
    reader.onload = () => {
      if (file.type === "image/gif") return resolve(reader.result);
      const img = new Image();
      img.onerror = () => reject(new Error("이미지를 열 수 없습니다."));
      img.onload = () => {
        const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.88));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function pick(file) {
  showErr("");
  if (!file) return;
  if (!TYPES.includes(file.type)) return showErr("JPEG, PNG, WEBP, GIF 이미지만 올릴 수 있습니다.");
  if (file.size > MAX_BYTES) return showErr("파일이 너무 큽니다. 10MB 이하로 올려 주세요.");
  try {
    imageData = await toDataUrl(file);
    $("preview").src = imageData;
    $("preview").style.display = "block";
    $("go").disabled = false;
  } catch (e) { showErr(e.message); }
}

async function generate() {
  if (!imageData) return;
  $("go").disabled = true; $("again").disabled = true;
  $("go").textContent = "분석 중… (최대 1분)";
  showErr("");
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageData, tone: $("tone").value, memo: $("memo").value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "요청에 실패했습니다.");
    $("features").textContent = JSON.stringify(data.features, null, 2);
    $("ig").textContent = data.instagram;
    $("th").textContent = data.threads;
    $("thCount").textContent = `${[...data.threads].length}자`;
    $("result").classList.remove("hidden");
    $("result").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    showErr(e.message);
  } finally {
    $("go").disabled = false; $("again").disabled = false;
    $("go").textContent = "초안 만들기";
  }
}

const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") $("file").click(); });
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); });
$("file").addEventListener("change", (e) => pick(e.target.files[0]));
$("go").addEventListener("click", generate);
$("again").addEventListener("click", generate);
document.querySelectorAll("[data-copy]").forEach((b) =>
  b.addEventListener("click", async () => {
    const text = $(b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(text); b.textContent = "복사됨"; }
    catch { b.textContent = "복사 실패"; }
    setTimeout(() => (b.textContent = "복사"), 1500);
  })
);
</script>
</body>
</html>
